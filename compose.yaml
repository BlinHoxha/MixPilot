services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mixpilot
      POSTGRES_USER: mixpilot
      POSTGRES_PASSWORD: mixpilot_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mixpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixpilot -d mixpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mixpilot-postgres:
